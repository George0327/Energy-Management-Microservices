server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    add_header Access-Control-Allow-Origin *;
    try_files $uri /index.html;
  }

  location /auth/ {
    add_header Access-Control-Allow-Origin *;
    try_files $uri /index.html;
  }

